name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site and the skill download
        run: |
          cp -r site _site
          mkdir -p /tmp/pkg/3blue1brown-video
          cp -r SKILL.md README.md LICENSE docs examples references scripts templates /tmp/pkg/3blue1brown-video/
          (cd /tmp/pkg && zip -qr -X "$GITHUB_WORKSPACE/_site/media/3blue1brown-video-skill.zip" 3blue1brown-video -x '*/__pycache__/*')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
